services:
  postgres-server:
    image: timescale/timescaledb:2.18.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_password
      POSTGRES_DB: zabbix
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - zabbix-network

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:ubuntu-7.4-latest
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: postgres-server
      DB_SERVER_PORT: 5432
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_password
      POSTGRES_DB: zabbix
      ENABLE_TIMESCALEDB: "true"
      ZBX_ENABLE_SNMP_TRAPS: "false"
    ports:
      - "10051:10051"
    depends_on:
      - postgres-server
    networks:
      - zabbix-network
    volumes:
      - zabbix-server-data:/var/lib/zabbix

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-7.4-latest
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: postgres-server
      DB_SERVER_PORT: 5432
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_password
      POSTGRES_DB: zabbix
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
      ZBX_SERVER_NAME: "Zabbix Server with TimescaleDB"
      PHP_TZ: "UTC"
    ports:
      - "80:8080"
      - "443:8443"
    depends_on:
      - postgres-server
      - zabbix-server
    networks:
      - zabbix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s

networks:
  zabbix-network:
    driver: bridge

volumes:
  postgres-data:
  zabbix-server-data:
